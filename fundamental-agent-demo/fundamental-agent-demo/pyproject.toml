[project]
name = "fundamental-agent-demo"
version = "0.1.0"
description = "Local-cache fundamental brief demo with SEC ingestion, LangGraph approval and LLM summaries."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "python-dotenv>=1.1,<2",
]

[tool.setuptools]
packages = ["fundamental_agent"]
